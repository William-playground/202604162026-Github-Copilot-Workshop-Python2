<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポモドーロタイマー</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- タイトルバー -->
        <div class="title-bar">
            <span class="title">ポモドーロタイマー</span>
            <div class="window-controls">
                <button class="settings-toggle" id="settingsToggle" aria-label="設定">⚙</button>
            </div>
        </div>

        <!-- 設定パネル -->
        <div class="settings-panel" id="settingsPanel" hidden>
            <!-- 作業時間 -->
            <div class="settings-group">
                <p class="settings-label">作業時間</p>
                <div class="settings-options" id="workOptions">
                    <button class="option-btn" data-value="15">15分</button>
                    <button class="option-btn selected" data-value="25">25分</button>
                    <button class="option-btn" data-value="35">35分</button>
                    <button class="option-btn" data-value="45">45分</button>
                </div>
            </div>

            <!-- 休憩時間 -->
            <div class="settings-group">
                <p class="settings-label">休憩時間</p>
                <div class="settings-options" id="breakOptions">
                    <button class="option-btn selected" data-value="5">5分</button>
                    <button class="option-btn" data-value="10">10分</button>
                    <button class="option-btn" data-value="15">15分</button>
                </div>
            </div>

            <!-- テーマ -->
            <div class="settings-group">
                <p class="settings-label">テーマ</p>
                <div class="settings-options" id="themeOptions">
                    <button class="option-btn selected" data-value="light">ライト</button>
                    <button class="option-btn" data-value="dark">ダーク</button>
                    <button class="option-btn" data-value="focus">フォーカス</button>
                </div>
            </div>

            <!-- サウンド -->
            <div class="settings-group">
                <p class="settings-label">サウンド</p>
                <div class="sound-toggles">
                    <label class="toggle-label">
                        <input type="checkbox" id="soundStart" checked>
                        <span>開始音</span>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="soundEnd" checked>
                        <span>終了音</span>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="soundTick">
                        <span>Tick音</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- メインコンテンツ -->
        <div class="main-content">
            <p class="status-label" id="statusLabel">作業中</p>

            <!-- 円形プログレスバー -->
            <div class="timer-circle">
                <svg viewBox="0 0 200 200">
                    <circle class="track" cx="100" cy="100" r="85"></circle>
                    <circle class="progress" id="progressCircle" cx="100" cy="100" r="85"></circle>
                </svg>
                <div class="timer-display" id="timerDisplay">25:00</div>
            </div>

            <!-- ボタン -->
            <div class="button-group">
                <button class="btn btn-primary" id="startBtn">開始</button>
                <button class="btn btn-secondary" id="resetBtn">リセット</button>
            </div>
        </div>

        <!-- 今日の進捗 -->
        <div class="progress-section">
            <p class="progress-title">今日の進捗</p>
            <div class="progress-stats">
                <div class="stat">
                    <span class="stat-value" id="completedCount">0</span>
                    <span class="stat-label">完了</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="focusTime">0分</span>
                    <span class="stat-label">集中時間</span>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/timer.js') }}"></script>
</body>
</html>
