<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポモドーロタイマー</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- タイトルバー -->
        <div class="title-bar">
            <span class="title">ポモドーロタイマー</span>
            <div class="window-controls">
                <span class="control">ー</span>
                <span class="control">□</span>
                <span class="control">×</span>
            </div>
        </div>

        <!-- XP・レベル表示 -->
        <div class="xp-section">
            <div class="xp-header">
                <span class="level-badge" id="levelBadge">Lv.1</span>
                <span class="xp-text" id="xpText">0 / 100 XP</span>
                <span class="streak-badge" id="streakBadge">🔥 0日</span>
            </div>
            <div class="xp-bar-container">
                <div class="xp-bar" id="xpBar" style="width: 0%"></div>
            </div>
        </div>

        <!-- メインコンテンツ -->
        <div class="main-content">
            <p class="status-label" id="statusLabel">作業中</p>

            <!-- 円形プログレスバー -->
            <div class="timer-circle">
                <svg viewBox="0 0 200 200">
                    <circle class="track" cx="100" cy="100" r="85"></circle>
                    <circle class="progress" id="progressCircle" cx="100" cy="100" r="85"></circle>
                </svg>
                <div class="timer-display" id="timerDisplay">25:00</div>
            </div>

            <!-- ボタン -->
            <div class="button-group">
                <button class="btn btn-primary" id="startBtn">開始</button>
                <button class="btn btn-secondary" id="resetBtn">リセット</button>
            </div>
        </div>

        <!-- 今日の進捗 -->
        <div class="progress-section">
            <p class="progress-title">今日の進捗</p>
            <div class="progress-stats">
                <div class="stat">
                    <span class="stat-value" id="completedCount">0</span>
                    <span class="stat-label">完了</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="focusTime">0分</span>
                    <span class="stat-label">集中時間</span>
                </div>
            </div>
        </div>

        <!-- 達成バッジ -->
        <div class="badges-section">
            <p class="section-title">達成バッジ</p>
            <div class="badges-grid" id="badgesGrid">
                <!-- JS で動的生成 -->
            </div>
        </div>

        <!-- 週間統計 -->
        <div class="stats-section">
            <p class="section-title">週間統計</p>
            <div class="weekly-chart" id="weeklyChart">
                <!-- JS で動的生成 -->
            </div>
            <div class="stats-summary" id="statsSummary">
                <div class="summary-item">
                    <span class="summary-value" id="weeklyCount">0</span>
                    <span class="summary-label">今週の完了</span>
                </div>
                <div class="summary-item">
                    <span class="summary-value" id="weeklyMinutes">0分</span>
                    <span class="summary-label">今週の集中</span>
                </div>
                <div class="summary-item">
                    <span class="summary-value" id="weeklyAvg">0分</span>
                    <span class="summary-label">平均/日</span>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/timer.js') }}"></script>
</body>
</html>
